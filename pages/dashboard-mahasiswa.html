<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mahasiswa - Sistem Absensi</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    
    <div class="container mx-auto px-4 py-8">
        
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6 fade-in">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Dashboard Mahasiswa</h1>
                    <p class="text-gray-600 mt-1" id="mahasiswaName">Loading...</p>
                </div>
                <button onclick="logout()" class="btn-danger">
                    🚪 Logout
                </button>
            </div>
        </div>
        
        <!-- Quick Action - Scan QR -->
        <div class="mb-6">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg shadow-lg p-8 text-white cursor-pointer hover:shadow-xl transition transform hover:-translate-y-1" onclick="goToScan()">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-3xl font-bold mb-2">📷 Scan QR Code</h3>
                        <p class="text-indigo-100 text-lg">Klik untuk absen kuliah</p>
                    </div>
                    <div class="text-8xl">➡️</div>
                </div>
            </div>
        </div>
        
        <!-- Stats Cards -->
        <div class="grid md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total Hadir</p>
                        <p class="text-3xl font-bold text-green-600" id="countHadir">0</p>
                    </div>
                    <div class="text-5xl">✅</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Sakit</p>
                        <p class="text-3xl font-bold text-yellow-600" id="countSakit">0</p>
                    </div>
                    <div class="text-5xl">🤒</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Izin</p>
                        <p class="text-3xl font-bold text-blue-600" id="countIzin">0</p>
                    </div>
                    <div class="text-5xl">📝</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Alpha</p>
                        <p class="text-3xl font-bold text-red-600" id="countAlpha">0</p>
                    </div>
                    <div class="text-5xl">❌</div>
                </div>
            </div>
        </div>
        
        <!-- Attendance History -->
        <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Riwayat Kehadiran</h2>
                <div class="flex gap-2">
                    <button onclick="deleteAllHistory()" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg transition" id="deleteAllBtn" style="display:none;">
                        🗑️ Hapus Semua
                    </button>
                    <button onclick="refreshHistory()" class="text-indigo-600 hover:text-indigo-800 font-semibold">
                        🔄 Refresh
                    </button>
                </div>
            </div>
            
            <div id="historyList"></div>
        </div>
        
    </div>
    
    <!-- Modal Konfirmasi -->
    <div id="confirmModal" style="display:none;" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-md mx-4">
            <h3 class="text-xl font-bold mb-4">Konfirmasi Hapus</h3>
            <p class="text-gray-600 mb-6" id="confirmMessage">Apakah Anda yakin ingin menghapus riwayat ini?</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeConfirmModal()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold transition">
                    Batal
                </button>
                <button onclick="confirmDelete()" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-semibold transition">
                    Hapus
                </button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Check authentication
        if (!requireAuth('mahasiswa')) {
            // Will redirect if not authenticated
        }
        
        const user = getCurrentUser();
        let currentHistory = [];
        let deleteCallback = null;
        
        // Display mahasiswa info
        document.getElementById('mahasiswaName').textContent = user.nama + ' | NPM: ' + user.npm + ' | Angkatan: ' + user.kelas;
        
        // Go to scan page
        function goToScan() {
            window.location.href = 'scan-qr.html';
        }
        
        // Get mahasiswa attendance history
        async function getMahasiswaAttendance() {
            const sessionKeys = await StorageManager.list('attendance:');
            const allAttendance = [];
            
            for (const key of sessionKeys) {
                const attendance = await StorageManager.get(key);
                if (attendance && Array.isArray(attendance)) {
                    // Filter attendance for this mahasiswa
                    const myAttendance = attendance.filter(function(a) {
                        return a.npm === user.npm;
                    });
                    
                    if (myAttendance.length > 0) {
                        // Get session info
                        const sessionId = key.replace('attendance:', '');
                        const session = await StorageManager.get('session:' + sessionId);
                        
                        if (session) {
                            allAttendance.push({
                                sessionId: sessionId,
                                session: session,
                                attendance: myAttendance[0]
                            });
                        }
                    }
                }
            }
            
            // Sort by timestamp (newest first)
            allAttendance.sort(function(a, b) {
                return b.session.timestampMulai - a.session.timestampMulai;
            });
            
            return allAttendance;
        }
        
        // Delete single attendance record
        async function deleteSingleAttendance(sessionId) {
            const key = 'attendance:' + sessionId;
            const attendance = await StorageManager.get(key);
            
            if (attendance && Array.isArray(attendance)) {
                // Remove this mahasiswa's attendance
                const updatedAttendance = attendance.filter(function(a) {
                    return a.npm !== user.npm;
                });
                
                // Save updated attendance
                await StorageManager.set(key, updatedAttendance);
                
                // Reload history
                await loadHistory();
                
                showNotification('Riwayat berhasil dihapus!', 'success');
            }
        }
        
        // Delete all attendance records for this mahasiswa
        async function deleteAllAttendanceRecords() {
            const sessionKeys = await StorageManager.list('attendance:');
            
            for (const key of sessionKeys) {
                const attendance = await StorageManager.get(key);
                if (attendance && Array.isArray(attendance)) {
                    // Remove this mahasiswa's attendance
                    const updatedAttendance = attendance.filter(function(a) {
                        return a.npm !== user.npm;
                    });
                    
                    // Save updated attendance
                    await StorageManager.set(key, updatedAttendance);
                }
            }
            
            // Reload history
            await loadHistory();
            
            showNotification('Semua riwayat berhasil dihapus!', 'success');
        }
        
        // Show confirm modal
        function showConfirmModal(message, callback) {
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').style.display = 'flex';
            deleteCallback = callback;
        }
        
        // Close confirm modal
        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
            deleteCallback = null;
        }
        
        // Confirm delete
        async function confirmDelete() {
            closeConfirmModal();
            if (deleteCallback) {
                showLoading();
                await deleteCallback();
                hideLoading();
            }
        }
        
        // Delete single history
        function deleteHistory(sessionId) {
            showConfirmModal('Apakah Anda yakin ingin menghapus riwayat kehadiran ini?', function() {
                return deleteSingleAttendance(sessionId);
            });
        }
        
        // Delete all history
        function deleteAllHistory() {
            showConfirmModal('Apakah Anda yakin ingin menghapus SEMUA riwayat kehadiran Anda? Tindakan ini tidak dapat dibatalkan!', function() {
                return deleteAllAttendanceRecords();
            });
        }
        
        // Show notification
        function showNotification(message, type) {
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            
            const notif = document.createElement('div');
            notif.className = 'fixed top-4 right-4 ' + colors[type] + ' text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-opacity';
            notif.textContent = message;
            document.body.appendChild(notif);
            
            setTimeout(function() {
                notif.style.opacity = '0';
                setTimeout(function() {
                    document.body.removeChild(notif);
                }, 300);
            }, 3000);
        }
        
        // Render history
        function renderHistory(history) {
            currentHistory = history;
            const container = document.getElementById('historyList');
            const deleteAllBtn = document.getElementById('deleteAllBtn');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500">' +
                    '<div class="text-6xl mb-4">📭</div>' +
                    '<p class="text-xl">Belum ada riwayat kehadiran</p>' +
                    '<p class="text-sm mt-2">Scan QR Code untuk mulai absen</p>' +
                    '</div>';
                deleteAllBtn.style.display = 'none';
                return;
            }
            
            // Show delete all button
            deleteAllBtn.style.display = 'block';
            
            // Calculate stats
            let hadir = 0, sakit = 0, izin = 0, alpha = 0;
            history.forEach(function(h) {
                if (h.attendance.status === 'hadir') hadir++;
                else if (h.attendance.status === 'sakit') sakit++;
                else if (h.attendance.status === 'izin') izin++;
                else if (h.attendance.status === 'alpha') alpha++;
            });
            
            document.getElementById('countHadir').textContent = hadir;
            document.getElementById('countSakit').textContent = sakit;
            document.getElementById('countIzin').textContent = izin;
            document.getElementById('countAlpha').textContent = alpha;
            
            // Render table
            let html = '<div class="overflow-x-auto"><table class="data-table">';
            html += '<thead><tr>' +
                '<th>No</th>' +
                '<th>Mata Kuliah</th>' +
                '<th>Kelas</th>' +
                '<th>Tanggal</th>' +
                '<th>Jam Scan</th>' +
                '<th>Status</th>' +
                '<th>Aksi</th>' +
                '</tr></thead><tbody>';
            
            history.forEach(function(item, index) {
                let badge = '';
                if (item.attendance.status === 'hadir') badge = '<span class="badge badge-success">Hadir</span>';
                else if (item.attendance.status === 'sakit') badge = '<span class="badge badge-warning">Sakit</span>';
                else if (item.attendance.status === 'izin') badge = '<span class="badge badge-info">Izin</span>';
                else badge = '<span class="badge badge-danger">Alpha</span>';
                
                html += '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + item.session.mataKuliah + '</td>' +
                    '<td>' + item.session.kelas + '</td>' +
                    '<td>' + item.session.tanggal + '</td>' +
                    '<td>' + (item.attendance.jamScan || '-') + '</td>' +
                    '<td>' + badge + '</td>' +
                    '<td><button onclick="deleteHistory(\'' + item.sessionId + '\')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">🗑️ Hapus</button></td>' +
                    '</tr>';
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }
        
        // Refresh history
        async function refreshHistory() {
            showLoading();
            await loadHistory();
            hideLoading();
        }
        
        // Load history
        async function loadHistory() {
            const history = await getMahasiswaAttendance();
            renderHistory(history);
        }
        
        // Loading functions
        function showLoading() {
            // Simple loading implementation
            document.body.style.cursor = 'wait';
        }
        
        function hideLoading() {
            document.body.style.cursor = 'default';
        }
        
        // Initial load
        loadHistory();
    </script>
    
</body>
</html>
