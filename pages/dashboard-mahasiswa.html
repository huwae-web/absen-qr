<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mahasiswa - Sistem Absensi</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    
    <div class="container mx-auto px-4 py-8">
        
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6 fade-in">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Dashboard Mahasiswa</h1>
                    <p class="text-gray-600 mt-1" id="mahasiswaName">Loading...</p>
                </div>
                <button onclick="logout()" class="btn-danger">
                    🚪 Logout
                </button>
            </div>
        </div>
        
        <!-- Quick Action - Scan QR -->
        <div class="mb-6">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg shadow-lg p-8 text-white cursor-pointer hover:shadow-xl transition transform hover:-translate-y-1" onclick="goToScan()">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-3xl font-bold mb-2">📷 Scan QR Code</h3>
                        <p class="text-indigo-100 text-lg">Klik untuk absen kuliah</p>
                    </div>
                    <div class="text-8xl">➡️</div>
                </div>
            </div>
        </div>
        
        <!-- Stats Cards -->
        <div class="grid md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total Hadir</p>
                        <p class="text-3xl font-bold text-green-600" id="countHadir">0</p>
                    </div>
                    <div class="text-5xl">✅</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Sakit</p>
                        <p class="text-3xl font-bold text-yellow-600" id="countSakit">0</p>
                    </div>
                    <div class="text-5xl">🤒</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Izin</p>
                        <p class="text-3xl font-bold text-blue-600" id="countIzin">0</p>
                    </div>
                    <div class="text-5xl">📝</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Alpa</p>
                        <p class="text-3xl font-bold text-red-600" id="countAlpa">0</p>
                    </div>
                    <div class="text-5xl">❌</div>
                </div>
            </div>
        </div>
        
        <!-- Attendance History -->
        <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Riwayat Kehadiran</h2>
                <div class="flex gap-2">
                    <button onclick="deleteAllHistory()" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg transition" id="deleteAllBtn" style="display:none;">
                        🗑️ Hapus Semua
                    </button>
                    <button onclick="refreshHistory()" class="text-indigo-600 hover:text-indigo-800 font-semibold">
                        🔄 Refresh
                    </button>
                </div>
            </div>
            
            <div id="historyList"></div>
        </div>
        
    </div>
    
    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Check authentication
        if (!requireAuth('mahasiswa')) {
            // Will redirect if not authenticated
        }
        
        const user = getCurrentUser();
        let currentHistory = [];
        
        // Display mahasiswa info
        document.getElementById('mahasiswaName').textContent = user.nama + ' | NPM: ' + user.npm + ' | Angkatan: ' + user.kelas;
        
        // Go to scan page
        function goToScan() {
            window.location.href = 'scan-qr.html';
        }
        
        // ==================== HIDDEN LIST MANAGEMENT ====================
        // Storage key untuk hidden list: hidden:mahasiswa:NPM
        
        // Get hidden list for current mahasiswa
        async function getHiddenList() {
            const key = 'hidden:mahasiswa:' + user.npm;
            const hiddenList = await StorageManager.get(key);
            return hiddenList || [];
        }
        
        // Add session to hidden list
        async function addToHiddenList(sessionId) {
            const key = 'hidden:mahasiswa:' + user.npm;
            let hiddenList = await getHiddenList();
            
            if (!hiddenList.includes(sessionId)) {
                hiddenList.push(sessionId);
                await StorageManager.set(key, hiddenList);
                console.log('✅ Added to hidden list:', sessionId);
            }
            
            return true;
        }
        
        // Remove session from hidden list (untuk restore jika perlu)
        async function removeFromHiddenList(sessionId) {
            const key = 'hidden:mahasiswa:' + user.npm;
            let hiddenList = await getHiddenList();
            
            hiddenList = hiddenList.filter(function(id) {
                return id !== sessionId;
            });
            
            await StorageManager.set(key, hiddenList);
            console.log('✅ Removed from hidden list:', sessionId);
            return true;
        }
        
        // Clear all hidden list
        async function clearHiddenList() {
            const key = 'hidden:mahasiswa:' + user.npm;
            await StorageManager.set(key, []);
            console.log('✅ Hidden list cleared');
            return true;
        }
        
        // ==================== ATTENDANCE FUNCTIONS ====================
        
        // Get mahasiswa attendance history (filtered by hidden list)
        async function getMahasiswaAttendance() {
            const sessionKeys = await StorageManager.list('attendance:');
            const hiddenList = await getHiddenList();
            const allAttendance = [];
            
            console.log('Hidden sessions:', hiddenList);
            
            for (const key of sessionKeys) {
                const attendance = await StorageManager.get(key);
                if (attendance && Array.isArray(attendance)) {
                    // Filter attendance for this mahasiswa
                    const myAttendance = attendance.filter(function(a) {
                        return a.npm === user.npm;
                    });
                    
                    if (myAttendance.length > 0) {
                        // Get session info
                        const sessionId = key.replace('attendance:', '');
                        
                        // Skip if session is hidden
                        if (hiddenList.includes(sessionId)) {
                            console.log('Skipping hidden session:', sessionId);
                            continue;
                        }
                        
                        const session = await StorageManager.get('session:' + sessionId);
                        
                        if (session) {
                            allAttendance.push({
                                sessionId: sessionId,
                                session: session,
                                attendance: myAttendance[0]
                            });
                        }
                    }
                }
            }
            
            // Sort by timestamp (newest first)
            allAttendance.sort(function(a, b) {
                return b.session.timestampMulai - a.session.timestampMulai;
            });
            
            return allAttendance;
        }
        
        // ==================== DELETE FUNCTIONS ====================
        
        // Delete single attendance (add to hidden list)
        async function deleteSingleAttendance(sessionId) {
            try {
                console.log('=== SOFT DELETE START ===');
                console.log('Session ID:', sessionId);
                console.log('User NPM:', user.npm);
                
                // Add to hidden list instead of deleting from storage
                await addToHiddenList(sessionId);
                
                console.log('✅ Soft delete successful!');
                console.log('=== SOFT DELETE END ===');
                
                // Reload history
                await loadHistory();
                
                showNotification('Riwayat berhasil diHapus!', 'success');
                
            } catch (error) {
                console.error('❌ Error hiding attendance:', error);
                showNotification('Error: ' + error.message, 'error');
            }
        }
        
        // Delete all attendance records (add all to hidden list)
        async function deleteAllAttendanceRecords() {
            try {
                console.log('=== HIDE ALL START ===');
                
                // Get all session IDs for this mahasiswa
                const sessionKeys = await StorageManager.list('attendance:');
                const sessionsToHide = [];
                
                for (const key of sessionKeys) {
                    const attendance = await StorageManager.get(key);
                    if (attendance && Array.isArray(attendance)) {
                        const hasMyRecord = attendance.some(function(a) {
                            return a.npm === user.npm;
                        });
                        
                        if (hasMyRecord) {
                            const sessionId = key.replace('attendance:', '');
                            sessionsToHide.push(sessionId);
                        }
                    }
                }
                
                console.log('Sessions to hide:', sessionsToHide);
                
                // Add all to hidden list
                const key = 'hidden:mahasiswa:' + user.npm;
                await StorageManager.set(key, sessionsToHide);
                
                console.log('✅ All sessions hidden:', sessionsToHide.length);
                console.log('=== HIDE ALL END ===');
                
                // Reload history
                await loadHistory();
                
                showNotification('Semua riwayat berhasil diHapus! (' + sessionsToHide.length + ' records)', 'success');
                
            } catch (error) {
                console.error('❌ Error hiding all attendance:', error);
                showNotification('Error: ' + error.message, 'error');
            }
        }
        
        // Delete single history
        function deleteHistory(sessionId) {
            console.log('deleteHistory called with sessionId:', sessionId);
            
            if (confirm('Apakah Anda yakin ingin menghapus riwayat kehadiran ini dari dashboard Anda?')) {
                console.log('Confirmed! Calling deleteSingleAttendance...');
                showLoading();
                deleteSingleAttendance(sessionId).then(function() {
                    hideLoading();
                }).catch(function(error) {
                    console.error('Error:', error);
                    hideLoading();
                });
            }
        }
        
        // Delete all history
        function deleteAllHistory() {
            console.log('deleteAllHistory called');
            
            if (confirm('Apakah Anda yakin ingin menghapus semua riwayat kehadiran ini dari dashboard Anda?')) {
                console.log('Confirmed! Calling deleteAllAttendanceRecords...');
                showLoading();
                deleteAllAttendanceRecords().then(function() {
                    hideLoading();
                }).catch(function(error) {
                    console.error('Error:', error);
                    hideLoading();
                });
            }
        }
        
        // ==================== UI FUNCTIONS ====================
        
        // Show notification
        function showNotification(message, type) {
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            
            const notif = document.createElement('div');
            notif.className = 'fixed top-4 right-4 ' + colors[type] + ' text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-opacity';
            notif.textContent = message;
            document.body.appendChild(notif);
            
            setTimeout(function() {
                notif.style.opacity = '0';
                setTimeout(function() {
                    document.body.removeChild(notif);
                }, 300);
            }, 3000);
        }
        
        // Render history
        function renderHistory(history) {
            currentHistory = history;
            const container = document.getElementById('historyList');
            const deleteAllBtn = document.getElementById('deleteAllBtn');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500">' +
                    '<div class="text-6xl mb-4">📭</div>' +
                    '<p class="text-xl">Belum ada riwayat kehadiran</p>' +
                    '<p class="text-sm mt-2">Scan QR Code untuk mulai absen</p>' +
                    '</div>';
                deleteAllBtn.style.display = 'none';
                return;
            }
            
            // Show delete all button
            deleteAllBtn.style.display = 'block';
            
            // Calculate stats
            let hadir = 0, sakit = 0, izin = 0, Alpa = 0;
            history.forEach(function(h) {
                if (h.attendance.status === 'hadir') hadir++;
                else if (h.attendance.status === 'sakit') sakit++;
                else if (h.attendance.status === 'izin') izin++;
                else if (h.attendance.status === 'Alpa') Alpa++;
            });
            
            document.getElementById('countHadir').textContent = hadir;
            document.getElementById('countSakit').textContent = sakit;
            document.getElementById('countIzin').textContent = izin;
            document.getElementById('countAlpa').textContent = Alpa;
            
            // Render table
            let html = '<div class="overflow-x-auto"><table class="data-table">';
            html += '<thead><tr>' +
                '<th>No</th>' +
                '<th>Mata Kuliah</th>' +
                '<th>Kelas</th>' +
                '<th>Tanggal</th>' +
                '<th>Jam Scan</th>' +
                '<th>Status</th>' +
                '<th>Aksi</th>' +
                '</tr></thead><tbody>';
            
            history.forEach(function(item, index) {
                let badge = '';
                if (item.attendance.status === 'hadir') badge = '<span class="badge badge-success">Hadir</span>';
                else if (item.attendance.status === 'sakit') badge = '<span class="badge badge-warning">Sakit</span>';
                else if (item.attendance.status === 'izin') badge = '<span class="badge badge-info">Izin</span>';
                else badge = '<span class="badge badge-danger">Alpa</span>';
                
                html += '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + item.session.mataKuliah + '</td>' +
                    '<td>' + item.session.kelas + '</td>' +
                    '<td>' + item.session.tanggal + '</td>' +
                    '<td>' + (item.attendance.jamScan || '-') + '</td>' +
                    '<td>' + badge + '</td>' +
                    '<td><button class="delete-btn bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition" data-session-id="' + item.sessionId + '">🗑️ Hapus</button></td>' +
                    '</tr>';
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;
            
            // Add event listeners to delete buttons
            const deleteButtons = container.querySelectorAll('.delete-btn');
            deleteButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const sessionId = this.getAttribute('data-session-id');
                    console.log('Delete button clicked for session:', sessionId);
                    deleteHistory(sessionId);
                });
            });
        }
        
        // Refresh history
        async function refreshHistory() {
            showLoading();
            await loadHistory();
            hideLoading();
        }
        
        // Load history
        async function loadHistory() {
            console.log('loadHistory() called');
            const history = await getMahasiswaAttendance();
            console.log('History loaded, total visible records:', history.length);
            renderHistory(history);
            console.log('History rendered');
        }
        
        // Loading functions
        function showLoading() {
            document.body.style.cursor = 'wait';
        }
        
        function hideLoading() {
            document.body.style.cursor = 'default';
        }
        
        // Initial load
        loadHistory();
        
        console.log('✅ Dashboard Mahasiswa loaded with Soft Delete feature');
        console.log('📝 Hidden list stored at: hidden:mahasiswa:' + user.npm);
    </script>
    
</body>
</html>
